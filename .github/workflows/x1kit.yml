# Checks the commits (same rules as the git hooks), builds and tests X1Kit and
# the application's X1ScanCore (against the simulator only), and builds the app.
name: X1Kit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Pull requests share a group, so a new push to the pull request replaces the
  # running check (base..head covers every commit). Pushes to main get one
  # group per run: a cancelled or replaced push run would leave its commits
  # unchecked, since the next push only checks from its own `before`.
  group: x1kit-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  safeguards:
    # tools/git-hooks/x1-check on every commit of the push or pull request:
    # serial numbers, scan / raw / firmware files, size, commit messages.
    # The hooks are optional and can be bypassed with --no-verify; this cannot.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check commits
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # For a pull request, run x1-check as it is on the base branch (main), not
          # the pull request's own copy, which could weaken the check that verifies it.
          if [ "$EVENT" = pull_request ]; then
            git show "$BASE:tools/git-hooks/x1-check" > "$RUNNER_TEMP/x1-check" \
              || { echo "x1-check not found at $BASE" >&2; exit 1; }
            checker="$RUNNER_TEMP/x1-check"
          else
            checker=tools/git-hooks/x1-check
          fi
          bash "$checker" --range "$BASE" "$HEAD_SHA"

  test:
    # Latest GitHub-hosted macOS image (macOS 26, arm64). The package requires macOS 26.
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: X1Kit
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      # Xcode pinned to 26.5 (the .icon app icon needs Xcode 26; the image keeps
      # every 26.x minor release). Fails with the list if it is gone.
      - name: Select Xcode 26.5
        run: |
          # Keep both "Select Xcode 26.5" steps the same.
          xcode=""
          for candidate in /Applications/Xcode_26.5.app /Applications/Xcode_26.5.0.app; do
            if [ -d "$candidate" ]; then xcode=$candidate; break; fi
          done
          if [ -z "$xcode" ]; then
            xcode=$(ls -d /Applications/Xcode_26.5*.app 2>/dev/null | grep -vi beta | sort | tail -n 1 || true)
          fi
          if [ -z "$xcode" ]; then
            echo "Xcode 26.5 not found; installed:" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $xcode"

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

  app:
    # The application: X1ScanCore tests (simulator only), read-only guard, app build.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      # Xcode pinned to 26.5 (the .icon app icon needs Xcode 26; the image keeps
      # every 26.x minor release). Fails with the list if it is gone.
      - name: Select Xcode 26.5
        run: |
          # Keep both "Select Xcode 26.5" steps the same.
          xcode=""
          for candidate in /Applications/Xcode_26.5.app /Applications/Xcode_26.5.0.app; do
            if [ -d "$candidate" ]; then xcode=$candidate; break; fi
          done
          if [ -z "$xcode" ]; then
            xcode=$(ls -d /Applications/Xcode_26.5*.app 2>/dev/null | grep -vi beta | sort | tail -n 1 || true)
          fi
          if [ -z "$xcode" ]; then
            echo "Xcode 26.5 not found; installed:" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $xcode"

      - name: Read-only guard
        # The app reaches the real X1 through IOKitTransport(policy: .readOnly),
        # and, for the captured preview of step 4 only, through
        # IOKitTransport(capturedSequence:), created in AppModel.swift alone.
        # Tracked files of app/ may neither ask for another policy nor call the
        # C layer directly (which would bypass the checks). A text check, not a proof.
        run: |
          if git grep -nE 'unrestricted|allowsStateChangingCommands|CommandPolicy\(|CX1IOKit|cx1_' -- app/; then
            echo "app/ must not create a command policy other than .readOnly or use CX1IOKit" >&2
            exit 1
          fi
          if git grep -nE 'capturedSequence:' -- app/ ':!app/X1ScanCore/Sources/X1ScanCore/App/AppModel.swift' ':!app/X1ScanCore/Tests/'; then
            echo "IOKitTransport(capturedSequence:) may only be created in AppModel.swift" >&2
            exit 1
          fi

      - name: Test X1ScanCore
        working-directory: app/X1ScanCore
        run: swift test

      - name: Build the app (Debug and Release)
        working-directory: app
        run: |
          for configuration in Debug Release; do
            xcodebuild -project X1Scan.xcodeproj -scheme X1Scan -configuration "$configuration" \
              -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build
            app="$RUNNER_TEMP/dd/Build/Products/$configuration/X1 Scan.app"
            # The icon is compiled and the licences are copied (About).
            /usr/libexec/PlistBuddy -c "Print CFBundleIconName" "$app/Contents/Info.plist"
            test -f "$app/Contents/Resources/Assets.car"
            test -f "$app/Contents/Resources/LICENSE"
            test -f "$app/Contents/Resources/LICENSE-ICON"
            # Only the fixtures the app reads are bundled.
            for fixture in preview-sequence.json preview-sequence-cold.json \
                           preview-calibration-profile.json scan-sequence-2000ppi.json; do
              test -f "$app/Contents/Resources/$fixture"
            done
            for excluded in scan-windows-2026-11-18.json holder-code-lines.json holders/holder-code-lines.json; do
              if [ -e "$app/Contents/Resources/$excluded" ]; then
                echo "$excluded must not be in the app" >&2
                exit 1
              fi
            done
          done
